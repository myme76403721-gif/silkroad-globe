<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>잠긴 페이지</title>
<style>
  :root { --bg: #e8eef0; --surface: #f7f9f9; --ink: #15262e; --muted: #455c66; --line: #c3cfd4; --accent: #b3224a; --on: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d1a20; --surface: #15262e; --ink: #e5eef1; --muted: #94a9b2; --line: #2a414b; --accent: #ff7d9a; --on: #1a0a10; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 17px/1.5 system-ui, -apple-system, "Malgun Gothic", sans-serif; }
  main { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 16px; }
  form { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 26px 22px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 4px 20px rgba(0,0,0,.08); }
  h1 { margin: 0; font-size: 22px; }
  p { margin: 0; color: var(--muted); font-size: 15px; }
  input[type=password] { width: 100%; font: inherit; font-size: 26px; letter-spacing: .35em; text-align: center; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink); }
  label { display: flex; gap: 8px; align-items: center; font-size: 15px; color: var(--muted); }
  label input { width: 20px; height: 20px; }
  button { font: inherit; font-weight: 700; min-height: 50px; border: 0; border-radius: 12px; background: var(--accent); color: var(--on); cursor: pointer; }
  button:disabled { opacity: .6; }
  #msg { min-height: 1.4em; font-weight: 600; }
  #msg.bad { color: var(--accent); }
</style>
<body>
<main>
  <form id="f" hidden>
    <h1>잠긴 페이지</h1>
    <p>비밀번호를 넣어야 열립니다.</p>
    <input id="pw" type="password" inputmode="numeric" autocomplete="current-password" aria-label="비밀번호" required>
    <label><input type="checkbox" id="rm" checked> 이 기기에서 기억(다음부터 바로 열림)</label>
    <button id="go" type="submit">열기</button>
    <p id="msg" role="status"></p>
  </form>
</main>
<script>
(function () {
  "use strict";
  var KEY = "trip-lock-key", meta = null;
  var f = document.getElementById("f"), pw = document.getElementById("pw"), rm = document.getElementById("rm"), go = document.getElementById("go"), msg = document.getElementById("msg");
  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function tob64(buf) { var u = new Uint8Array(buf), s = ""; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  function getMeta() { return meta ? Promise.resolve(meta) : fetch("data/meta.json", { cache: "no-cache" }).then(function (r) { if (!r.ok) throw new Error("net"); return r.json(); }).then(function (m) { meta = m; return m; }); }
  function derive(p, m) {
    return crypto.subtle.importKey("raw", new TextEncoder().encode(p), "PBKDF2", false, ["deriveBits"]).then(function (k) {
      return crypto.subtle.deriveBits({ name: "PBKDF2", salt: b64(m.salt), iterations: m.iter, hash: "SHA-256" }, k, 512);
    });
  }
  function keysOf(bits) {
    var b = new Uint8Array(bits);
    return Promise.all([crypto.subtle.importKey("raw", b.slice(0, 32), { name: "AES-CBC" }, false, ["decrypt"]),
      crypto.subtle.importKey("raw", b.slice(32, 64), { name: "HMAC", hash: "SHA-256" }, false, ["verify"])]);
  }
  // 파일 = IV(16) + 암호문 + HMAC(32). 위변조·틀린 비밀번호면 HMAC 검사에서 걸림
  function dec(ks, buf) {
    var a = new Uint8Array(buf), body = a.slice(0, a.length - 32), mac = a.slice(a.length - 32);
    return crypto.subtle.verify("HMAC", ks[1], mac, body).then(function (ok) {
      if (!ok) throw new Error("bad");
      return crypto.subtle.decrypt({ name: "AES-CBC", iv: body.slice(0, 16) }, ks[0], body.slice(16));
    });
  }
  function get(i) { return fetch("data/" + i + ".enc").then(function (r) { if (!r.ok) throw new Error("net"); return r.arrayBuffer(); }); }
  function unlock(bits, remember) {
    return getMeta().then(function (m) {
      return keysOf(bits).then(function (ks) {
        return get(0).then(function (b) { return dec(ks, b); }).then(function (first) {
          if (remember) { try { localStorage.setItem(KEY, tob64(bits)); } catch (e) {} }
          msg.textContent = "여는 중…";
          var html = new TextDecoder().decode(first);
          return Promise.all(m.files.slice(1).map(function (n, j) {
            return get(j + 1).then(function (b) { return dec(ks, b); }).then(function (p) {
              return [n, URL.createObjectURL(new Blob([p], { type: /\.css$/.test(n) ? "text/css" : "text/javascript" }))];
            });
          })).then(function (list) {
            list.forEach(function (x) {
              var re = new RegExp('(src|href)="' + x[0].replace(/[.]/g, "\\.") + '(\\?[^"]*)?"', "g");
              html = html.replace(re, '$1="' + x[1] + '"');
            });
            // 풀어 낸 파일은 blob: 주소로 실행되므로 보안 정책에 blob:만 더함
            html = html.replace("script-src 'self'", "script-src 'self' blob:").replace("style-src 'self'", "style-src 'self' blob:");
            document.open(); document.write(html); document.close();
          });
        });
      });
    });
  }
  function showForm(t, bad) { f.hidden = false; go.disabled = false; msg.textContent = t || ""; msg.className = bad ? "bad" : ""; setTimeout(function () { pw.focus(); }, 50); }
  if (!window.crypto || !crypto.subtle) { showForm("이 브라우저는 잠금 해제를 지원하지 않습니다(https 주소로 여세요).", true); return; }
  f.addEventListener("submit", function (e) {
    e.preventDefault();
    go.disabled = true; msg.className = ""; msg.textContent = "확인하는 중…";
    getMeta().then(function (m) { return derive(pw.value, m); }).then(function (bits) { return unlock(bits, rm.checked); }).catch(function (err) {
      pw.value = "";
      showForm(err && err.message === "bad" ? "비밀번호가 틀렸습니다." : "불러오지 못했습니다. 인터넷 연결을 확인하세요.", true);
    });
  });
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) unlock(b64(saved).buffer, false).catch(function (err) { if (err && err.message === "bad") { try { localStorage.removeItem(KEY); } catch (e) {} } showForm(err && err.message === "bad" ? "" : "불러오지 못했습니다. 인터넷 연결을 확인하세요.", err && err.message !== "bad"); });
  else showForm();
})();
</script>
</body>
</html>
